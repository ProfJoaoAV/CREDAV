// ══════════════════════════
// FUNÇÕES DE DESENHO HELPERS
// ══════════════════════════
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function rnd(x,y,w,h,r,c){
  ctx.fillStyle=c;ctx.beginPath();
  ctx.roundRect(Math.round(x),Math.round(y),w,h,r);ctx.fill();
}

// ── Sombra no chão ──
function drawShadow(x,y,w){
  ctx.save();ctx.globalAlpha=0.18;
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x,y,w,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════════
// ALUNO — pixel art melhorado
// ══════════════════════════════════════════════
function drawStudent(sx,sy,dir,shirt,hair,fr,sit,stun,skinTone){
  const skin=skinTone||'#f5c99a';

  if(stun){
    drawShadow(sx,sy+1,20);
    ctx.save();ctx.translate(sx,sy-8);ctx.rotate(dir*Math.PI/2);
    // Corpo deitado
    px(-26,-12,52,22,shirt);
    // Cabeça
    rnd(-9,-28,18,16,4,skin);
    px(-9,-36,18,10,hair);
    // Estrelas animadas
    ctx.restore();
    for(let i=0;i<3;i++){
      const a=Date.now()/300+i*2.1;
      const ex=sx+Math.cos(a)*16, ey=sy-30+Math.sin(a)*7;
      ctx.fillStyle=['#ffe066','#ff9800','#fff'][i];
      ctx.font='11px serif';ctx.fillText('★',ex,ey);
    }
    return;
  }

  const leg=sit?0:[0,18,-18,0][fr%4];
  const arm=sit?0:[0,14,-14,0][fr%4];

  drawShadow(sx,sy+2,14);

  if(sit){
    // Tronco
    rnd(sx-11,sy-44,22,20,3,shirt);
    // Braços
    ctx.save();ctx.translate(sx-12,sy-42);ctx.rotate(-0.4);
    px(-4,0,6,14,shirt);px(-3,12,5,6,skin);ctx.restore();
    ctx.save();ctx.translate(sx+12,sy-42);ctx.rotate(0.4);
    px(-2,0,6,14,shirt);px(-2,12,5,6,skin);ctx.restore();
    // Pernas (sentado)
    px(sx-10,sy-24,22,8,'#2c3e50');
    px(sx-10,sy-16,8,16,'#1a1a1a');
    px(sx+2,sy-16,8,16,'#1a1a1a');
    px(sx-11,sy-1,8,5,'#222');px(sx+3,sy-1,8,5,'#222');
    // Cabeça
    rnd(sx-9,sy-68,18,20,4,skin);
    px(sx-9,sy-68,18,9,hair);
    // Olho
    const ex2=dir>0?sx+1:sx-6;
    px(ex2,sy-57,4,4,'#222');px(ex2+(dir>0?1:-1),sy-58,2,2,'#fff');
    // Boca
    px(sx-3,sy-50,7,2,'#c07060');
    return;
  }

  // ── PERNAS ──
  // Perna esquerda
  ctx.save();ctx.translate(sx-5,sy-18);ctx.rotate(leg*Math.PI/180);
  // Calças
  rnd(-5,0,10,22,2,'#2c3e50');
  // Sapato
  ctx.fillStyle='#1a1a1a';ctx.beginPath();
  ctx.ellipse(-1,24,7,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Perna direita
  ctx.save();ctx.translate(sx+5,sy-18);ctx.rotate(-leg*Math.PI/180);
  rnd(-5,0,10,22,2,'#1e3040');
  ctx.fillStyle='#111';ctx.beginPath();
  ctx.ellipse(1,24,7,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // ── CORPO / CAMISOLA ──
  // Sombra do corpo
  ctx.fillStyle=shadeColor(shirt,-20);ctx.fillRect(sx-11,sy-46,22,28);
  rnd(sx-11,sy-48,22,30,3,shirt);
  // Detalhe gola
  ctx.fillStyle=shadeColor(shirt,-30);ctx.fillRect(sx-3,sy-48,6,5);

  // ── BRAÇOS ──
  ctx.save();ctx.translate(sx-12,sy-44);ctx.rotate(-arm*Math.PI/180);
  rnd(-4,0,8,18,2,shirt);px(-3,16,6,6,skin);ctx.restore();
  ctx.save();ctx.translate(sx+12,sy-44);ctx.rotate(arm*Math.PI/180);
  rnd(-4,0,8,18,2,shirt);px(-3,16,6,6,skin);ctx.restore();

  // ── CABEÇA ──
  // Pescoço
  px(sx-3,sy-50,6,5,skin);
  // Cabeça
  rnd(sx-9,sy-72,18,22,5,skin);
  // Orelha
  rnd(sx+(dir>0?8:-9),sy-64,4,8,2,skin);
  // Cabelo
  ctx.fillStyle=hair;
  ctx.beginPath();
  ctx.roundRect(sx-9,sy-72,18,10,[5,5,0,0]);ctx.fill();
  // Extra cabelo lateral
  if(dir>0){px(sx-9,sy-66,4,6,hair);}else{px(sx+5,sy-66,4,6,hair);}
  // Olho
  const ex=dir>0?sx+2:sx-7;
  rnd(ex,sy-62,5,5,1,'#1a1a1a');
  px(ex+(dir>0?1:-1),sy-63,2,2,'#fff');
  // Pupila brilho
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillRect(ex+(dir>0?2:-2),sy-62,1,1);
  // Sobrancelha
  px(ex,sy-65,5,1,shadeColor(hair,-40));
  // Nariz
  px(dir>0?sx+4:sx-5,sy-56,3,4,shadeColor(skin,-20));
  // Boca
  px(sx-3,sy-50,7,2,'#c07060');
}

// ══════════════════════════════════════════════
// PROFESSOR — mais detalhado
// ══════════════════════════════════════════════
function drawTeacher(sx,sy,dir,coat,fr,stun,name,skinTone,hairC){
  const skin=skinTone||'#f0c090';
  const hairCol=hairC||'#1a1a1a';

  if(stun){
    drawShadow(sx,sy+1,22);
    ctx.save();ctx.translate(sx,sy-8);ctx.rotate(dir*Math.PI/2);
    rnd(-28,-14,56,26,4,coat);
    rnd(-9,-30,18,22,4,skin);
    px(-9,-40,18,14,hairCol);
    ctx.restore();
    for(let i=0;i<3;i++){
      const a=Date.now()/280+i*2.1;
      const ex=sx+Math.cos(a)*18,ey=sy-36+Math.sin(a)*9;
      ctx.fillStyle=['#ffe066','#ff9800','#fff'][i];
      ctx.font='12px serif';ctx.fillText('★',ex,ey);
    }
    return;
  }
  const leg=[0,12,-12,0][fr%4];
  const arm=[0,13,-13,0][fr%4];

  drawShadow(sx,sy+2,16);

  // ── PERNAS / CALÇAS ──
  ctx.save();ctx.translate(sx-6,sy-20);ctx.rotate(leg*Math.PI/180);
  rnd(-5,0,10,26,2,'#1a252f');
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(-1,28,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(sx+6,sy-20);ctx.rotate(-leg*Math.PI/180);
  rnd(-5,0,10,26,2,'#0d1a24');
  ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.ellipse(1,28,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // ── CASACO ──
  ctx.fillStyle=shadeColor(coat,-15);ctx.fillRect(sx-13,sy-60,26,38);
  rnd(sx-13,sy-62,26,40,3,coat);
  // Lapelas
  ctx.fillStyle=shadeColor(coat,-30);
  ctx.beginPath();
  if(dir>0){ctx.moveTo(sx-3,sy-62);ctx.lineTo(sx+8,sy-58);ctx.lineTo(sx+3,sy-22);ctx.lineTo(sx-3,sy-22);}
  else{ctx.moveTo(sx+3,sy-62);ctx.lineTo(sx-8,sy-58);ctx.lineTo(sx-3,sy-22);ctx.lineTo(sx+3,sy-22);}
  ctx.closePath();ctx.fill();
  // Camisa/gravata
  px(sx-4,sy-60,8,36,'#eee');
  // Gravata
  ctx.fillStyle='#c0392b';
  ctx.beginPath();ctx.moveTo(sx-2,sy-58);ctx.lineTo(sx+2,sy-58);ctx.lineTo(sx+1,sy-30);ctx.lineTo(sx-1,sy-30);ctx.closePath();ctx.fill();
  ctx.fillStyle='#922b21';
  ctx.beginPath();ctx.moveTo(sx-2,sy-30);ctx.lineTo(sx+2,sy-30);ctx.lineTo(sx+3,sy-22);ctx.lineTo(sx-3,sy-22);ctx.closePath();ctx.fill();
  // Botão
  px(sx-1,sy-48,2,2,'#ccc');px(sx-1,sy-42,2,2,'#ccc');

  // ── BRAÇOS ──
  ctx.save();ctx.translate(sx-14,sy-56);ctx.rotate(-arm*Math.PI/180);
  rnd(-5,0,8,22,2,coat);px(-4,20,7,8,skin);ctx.restore();
  ctx.save();ctx.translate(sx+14,sy-56);ctx.rotate(arm*Math.PI/180);
  rnd(-3,0,8,22,2,coat);px(-3,20,7,8,skin);ctx.restore();

  // ── CABEÇA ──
  px(sx-3,sy-64,6,6,skin);// pescoço
  rnd(sx-10,sy-88,20,26,5,skin);
  // Cabelo / calvície
  ctx.fillStyle=hairCol;
  ctx.beginPath();ctx.roundRect(sx-10,sy-88,20,12,[5,5,0,0]);ctx.fill();
  // Orelha
  rnd(sx+(dir>0?9:-11),sy-78,4,8,2,skin);
  // Óculos (frame)
  const ex=dir>0?sx+1:sx-8;
  ctx.strokeStyle='#444';ctx.lineWidth=1.5;
  ctx.strokeRect(ex-1,sy-74,8,6);
  // Olhos
  px(ex,sy-73,5,4,'#1a1a1a');
  px(ex+(dir>0?1:0),sy-74,2,2,'#fff');
  // Nariz
  rnd(dir>0?sx+4:sx-6,sy-66,4,5,2,shadeColor(skin,-20));
  // Boca
  px(sx-4,sy-59,9,3,'#b07060');

  // ── NOME BADGE ──
  const nw=name.length*6+10;
  ctx.fillStyle='rgba(0,0,0,0.8)';
  rnd(sx-nw/2,sy-106,nw,14,3,'rgba(0,0,0,0.8)');
  ctx.strokeStyle='#e74c3c';ctx.lineWidth=1;
  ctx.strokeRect(sx-nw/2,sy-106,nw,14);
  ctx.fillStyle='#ff6b6b';ctx.font='bold 9px Courier New';ctx.textAlign='center';
  ctx.fillText(name,sx,sy-96);ctx.textAlign='left';

  // ── CONE DE VISÃO ──
  const vdist=270;
  ctx.save();ctx.globalAlpha=0.05;
  ctx.fillStyle='#f39c12';
  ctx.beginPath();ctx.moveTo(sx,sy-44);
  ctx.lineTo(sx+dir*vdist,sy-44-50);ctx.lineTo(sx+dir*vdist,sy-44+50);
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.restore();
}

// ══ HELPER: escurecer cor ══
function shadeColor(color,percent){
  let n=parseInt(color.slice(1),16),
    r=Math.max(0,Math.min(255,(n>>16)+percent)),
    g=Math.max(0,Math.min(255,((n>>8)&0xFF)+percent)),
    b=Math.max(0,Math.min(255,(n&0xFF)+percent));
  return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

  for(let i=0;i<14;i++)parts.push({x,y,
    vx:(Math.random()-.5)*7,vy:Math.random()*-5-1,
    life:32,c:['#f39c12','#e74c3c','#f1c40f','#fff','#ff6b6b'][i%5]});
}

function fire(){
  if(sCD>0||P.sit) return;
  pellets.push({x:P.x+(P.dir>0?18:0),y:pgy()-40,vx:P.dir*11,vy:-2.5,fl:P.fl,life:100});
  sCD=38;
  teachers.forEach(t=>{
    if(canSee(t,P.x)&&t.stun===0) addLines(100,t.name+' viu-te usar a fisga!');
  });
}

function canSee(t,px2){
  if(t.fl!==P.fl||t.stun>0) return false;
  const dx=px2-(t.x+14);
  if(Math.sign(dx)!==t.dir) return false;
  return Math.abs(dx)<260;
}

function addLines(n,reason){
  if(penCD>0) return;
  lines+=n;if(lines>10000)lines=10000;
  penCD=90;
  teachers.forEach(tt=>{if(reason.startsWith(tt.name))tt.scold=120;});
  caughtTxt='📝 +'+n+' LINHAS\n'+reason;
  caughtT=140;
  document.getElementById('lnum').textContent=lines;
  const pct=lines/10000;
  const bar=document.getElementById('lbar');
  bar.style.width=(pct*100)+'%';
  bar.style.background=pct<.5?'linear-gradient(90deg,#27ae60,#2ecc71)':pct<.8?'linear-gradient(90deg,#e67e22,#f39c12)':'linear-gradient(90deg,#c0392b,#e74c3c)';
  document.getElementById('lbar-t').textContent=lines+' / 10000';
}

let cloudOffset=0;

function drawBG(){
  cloudOffset+=0.15;

  // ── EXTERIOR (piso 2) ──
  // Céu gradiente
  const skyG=ctx.createLinearGradient(0,0,0,FH);
  const h=getPeriodHour();
  if(h<10){// manhã
    skyG.addColorStop(0,'#87CEEB');skyG.addColorStop(1,'#b0e2f5');
  } else if(h<15){// tarde
    skyG.addColorStop(0,'#5ba3d4');skyG.addColorStop(1,'#c5e8f7');
  } else {// fim do dia
    skyG.addColorStop(0,'#e8834a');skyG.addColorStop(1,'#f5d5a0');
  }
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,FH);

  // Sol / astro
  const sunX=W*0.8, sunY=32;
  ctx.fillStyle= h>=15?'#ff7043':'#ffe066';
  ctx.beginPath();ctx.arc(sunX,sunY,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,240,100,0.25)';
  ctx.beginPath();ctx.arc(sunX,sunY,26,0,Math.PI*2);ctx.fill();

  // Nuvens mais detalhadas
  const clouds=[[80,28,70],[280,18,90],[520,35,60],[740,20,85],[1060,32,65],[1300,22,75]];
  clouds.forEach(([cx,cy,r])=>{
    const sx=((cx-camX*.18+cloudOffset)%(W+400))-200;
    ctx.fillStyle='rgba(255,255,255,.9)';
    // nuvem com múltiplos círculos
    ctx.beginPath();ctx.ellipse(sx,cy,r,16,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+r*.4,cy-10,r*.45,13,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx-r*.3,cy-7,r*.35,10,0,0,Math.PI*2);ctx.fill();
    // sombra base nuvem
    ctx.fillStyle='rgba(180,210,235,.4)';
    ctx.beginPath();ctx.ellipse(sx,cy+8,r*.9,6,0,0,Math.PI*2);ctx.fill();
  });

  // Edifício escola ao fundo (parallax)
  const bx=200-camX*.05;
  ctx.fillStyle='#c8b090';ctx.fillRect(bx,4,320,FH-36);
  ctx.fillStyle='#b8a080';
  // Janelas do fundo
  for(let wi=0;wi<4;wi++)for(let wj=0;wj<2;wj++){
    const wx=bx+30+wi*70,wy=10+wj*40;
    ctx.fillStyle='#87CEEB';ctx.fillRect(wx,wy,40,28);
    ctx.strokeStyle='#8a6040';ctx.lineWidth=2;ctx.strokeRect(wx,wy,40,28);
    ctx.strokeStyle='#7a5030';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(wx+20,wy);ctx.lineTo(wx+20,wy+28);ctx.stroke();
    ctx.beginPath();ctx.moveTo(wx,wy+14);ctx.lineTo(wx+40,wy+14);ctx.stroke();
  }
  // Tejado
  ctx.fillStyle='#8a6040';ctx.fillRect(bx-4,0,328,8);

  // Relva com textura
  const grassG=ctx.createLinearGradient(0,GY[2]-4,0,GY[2]+22);
  grassG.addColorStop(0,'#5cad3c');grassG.addColorStop(1,'#3a7a22');
  ctx.fillStyle=grassG;ctx.fillRect(0,GY[2]-4,W,28);
  // Faixas de relva
  ctx.fillStyle='#4a9430';
  for(let gx=(-camX*.3)%40;gx<W;gx+=40)ctx.fillRect(gx,GY[2]-4,20,28);
  // Erva fios
  ctx.strokeStyle='#2d6e1a';ctx.lineWidth=1;
  for(let gx=(-camX*.3)%12;gx<W;gx+=12){
    ctx.beginPath();ctx.moveTo(gx,GY[2]-4);ctx.lineTo(gx-3,GY[2]-12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gx+5,GY[2]-4);ctx.lineTo(gx+8,GY[2]-14);ctx.stroke();
  }

  // ── PISOS INTERIORES ──
  // Piso 1
  const wallG1=ctx.createLinearGradient(0,FH,0,FH+FH);
  wallG1.addColorStop(0,'#f0e8d8');wallG1.addColorStop(1,'#e8dcc8');
  ctx.fillStyle=wallG1;ctx.fillRect(0,FH,W,FH);
  // Piso 0
  const wallG0=ctx.createLinearGradient(0,FH*2,0,FH*2+FH);
  wallG0.addColorStop(0,'#ece0cc');wallG0.addColorStop(1,'#e0d4bc');
  ctx.fillStyle=wallG0;ctx.fillRect(0,FH*2,W,FH);

  // ── TECTOS ──
  for(let f=0;f<3;f++){
    const ty=f===2?0:f===1?FH:FH*2;
    // Tecto com textura
    const ceilG=ctx.createLinearGradient(0,ty,0,ty+18);
    ceilG.addColorStop(0,'#f4f0e4');ceilG.addColorStop(1,'#ddd8c4');
    ctx.fillStyle=ceilG;ctx.fillRect(0,ty,W,18);
    // Vigas de tecto
    ctx.fillStyle='rgba(0,0,0,0.05)';
    for(let bx2=(-camX*.2)%120;bx2<W;bx2+=120)ctx.fillRect(bx2,ty,4,18);
    // Lâmpadas fluorescentes
    for(let lx=(-camX*.15)%140+70;lx<W;lx+=140){
      // Suporte
      ctx.fillStyle='#ccc8b0';ctx.fillRect(lx-20,ty+12,40,4);
      // Tubo
      ctx.fillStyle='#fffde7';ctx.fillRect(lx-18,ty+14,36,3);
      // Halo de luz
      const lampG=ctx.createRadialGradient(lx,ty+18,0,lx,ty+18,30);
      lampG.addColorStop(0,'rgba(255,250,200,0.35)');lampG.addColorStop(1,'rgba(255,250,200,0)');
      ctx.fillStyle=lampG;ctx.fillRect(lx-30,ty+14,60,30);
    }
  }

  // ── CHÃO LOSETAS ──
  for(let f=0;f<2;f++){
    const gy=GY[f];
    // Chão base
    const floorG=ctx.createLinearGradient(0,gy-2,0,gy+22);
    floorG.addColorStop(0,'#d4b06e');floorG.addColorStop(1,'#b89050');
    ctx.fillStyle=floorG;ctx.fillRect(0,gy-2,W,24);
    // Losetas
    const tileSize=50;
    for(let tx=(-camX*.8)%tileSize;tx<W;tx+=tileSize){
      // brilho alternado
      if(Math.floor((tx+camX)/tileSize)%2===0){
        ctx.fillStyle='rgba(255,255,255,0.08)';
        ctx.fillRect(tx,gy-2,tileSize,24);
      }
      // separadores
      ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(tx,gy-2);ctx.lineTo(tx,gy+22);ctx.stroke();
    }
    // Rodapé
    ctx.fillStyle='#8a6030';ctx.fillRect(0,gy-4,W,3);
  }

  // ── RODAPÉ PAREDES ──
  for(let f=1;f<3;f++){
    const gy=GY[f]-2;
    ctx.fillStyle='#9a8060';ctx.fillRect(0,gy+20,W,4);
  }

  // ── LINHA DIVISÓRIA DOS PISOS ──
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,FH-2,W,3);
  ctx.fillRect(0,FH*2-2,W,3);
}

function getPeriodHour(){
  const m=9*60+Math.floor(tick);
  return Math.floor(m/60);
}

// ════════════════════
// ESCADAS MELHORADAS
// ════════════════════
function drawStairs(){
  STAIRS.forEach(s=>{
    const sx=s.x-camX;
    if(sx<-80||sx>W+80) return;
    const yTop=GY[s.hi]+22;
    const yBot=GY[s.lo];
    const nStep=8;
    const sH=(yBot-yTop)/nStep;
    const sW=56/nStep;

    // Estrutura (triângulo de suporte)
    ctx.fillStyle='#7a5a28';
    ctx.beginPath();ctx.moveTo(sx,yBot);ctx.lineTo(sx+56,yBot);ctx.lineTo(sx+56,yTop);ctx.fill();

    // Degraus
    for(let i=0;i<nStep;i++){
      const sy2=yTop+i*sH;
      const sw2=56-i*sW;
      const stepG=ctx.createLinearGradient(sx+i*sW,sy2,sx+i*sW,sy2+sH);
      stepG.addColorStop(0,i%2===0?'#d4b878':'#c4a862');
      stepG.addColorStop(1,i%2===0?'#b89858':'#a88848');
      ctx.fillStyle=stepG;ctx.fillRect(sx+i*sW,sy2,sw2,sH+1);
      // Borda do degrau (nariz)
      ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(sx+i*sW,sy2,sw2,2);
      // Sombra inferior
      ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(sx+i*sW,sy2+sH-2,sw2,2);
    }
    // Sombra embaixo
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(sx,yBot,56,4);

    // Corrimão
    ctx.save();ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=4;
    ctx.strokeStyle='#5c3c10';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(sx+5,yBot-2);ctx.lineTo(sx+nStep*sW+12,yTop+4);ctx.stroke();
    ctx.strokeStyle='#8a5a22';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx+5,yBot-2);ctx.lineTo(sx+nStep*sW+12,yTop+4);ctx.stroke();
    ctx.restore();

    // Suportes do corrimão
    for(let i=0;i<=nStep;i+=2){
      const sy2=yTop+i*sH+sH/2;
      const stX=sx+i*sW+sW/2;
      ctx.strokeStyle='#6a4818';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(stX,sy2+sH*.3);ctx.lineTo(stX+sW/nStep*12,yTop+4+(i/nStep)*(yTop-yTop));
      // simplificado: poste vertical até corrimão
      const cY=yTop+4+i*(yBot-yTop-6)/nStep;
      ctx.moveTo(stX,sy2);ctx.lineTo(stX-(i)*(sW/nStep)*.8+sx+nStep*sW/2,cY);
      ctx.stroke();
    }

    // Indicador interativo
    const near=Math.abs((P.x+12)-s.x)<SR+20;
    if(near&&(P.fl===s.lo||P.fl===s.hi)){
      ctx.fillStyle='rgba(243,156,18,.9)';ctx.font='bold 12px Courier New';ctx.textAlign='center';
      // Seta animada
      const bounce=Math.sin(Date.now()/200)*3;
      ctx.fillText('[ ↑ ↓ ]',sx+28,yTop-8+bounce);ctx.textAlign='left';
    }
  });
}

// LINHA DE VISÃO
// ════════════════════════════════════
function canSee(t,px2){
  if(t.fl!==P.fl||t.stun>0) return false;
  const dx=px2-(t.x+14);
  if(Math.sign(dx)!==t.dir) return false;
  return Math.abs(dx)<260;
}

// ════════════════════════════════════
// UPDATE JOGADOR
// ════════════════════════════════════
function updateP(){
  if(P.sit){
    if((K['x']||K['X'])&&!jSit){P.sit=false;jSit=true;}
    else if(!(K['x']||K['X']))jSit=false;
    return;
  }
  if(!(K['x']||K['X']))jSit=false;
  const spd=K['Shift']?2.8:1.7;
  P.mov=false;
  if(K['ArrowLeft']||K['a']){P.vx=-spd;P.dir=-1;P.mov=true;}
  else if(K['ArrowRight']||K['d']){P.vx=spd;P.dir=1;P.mov=true;}
  else{P.vx*=.6;if(Math.abs(P.vx)<.05)P.vx=0;}
  P.x+=P.vx;P.x=Math.max(4,Math.min(WALL-28,P.x));

  if(P.stairCD>0){P.stairCD--;}
  else{
    const cx=P.x+14;
    if(K['ArrowUp']||K['w']){
      const st=STAIRS.find(s=>Math.abs(cx-s.x)<SR && s.lo===P.fl);
      if(st){P.fl=st.hi;P.x=st.x-10;P.stairCD=45;}
    }
    if(K['ArrowDown']||K['s']){
      const st=STAIRS.find(s=>Math.abs(cx-s.x)<SR && s.hi===P.fl);
      if(st){P.fl=st.lo;P.x=st.x-10;P.stairCD=45;}
    }
  }

  if((K['x']||K['X'])&&!jSit){
    const per=SCH[getPeriod()];
    if(!per.free&&per.room!=='yard'){
      const rm=ROOMS[per.room];
      if(rm&&rm.fl===P.fl){
        const nd=rm.desks.find(dx=>Math.abs(P.x-dx)<42);
        if(nd){P.sit=true;P.x=nd;jSit=true;}
      }
    }
  }
  if((K['z']||K['Z'])&&!jFire){fire();jFire=true;}
  else if(!(K['z']||K['Z']))jFire=false;

  if(P.mov)P.aT+=.2; else P.aT=0;
  P.frame=Math.floor(P.aT)%4;
  if(sCD>0)sCD--;
  if(penCD>0)penCD--;

  const tgt=P.x-W/2+14;
  camX+=(tgt-camX)*.1;
  camX=Math.max(0,Math.min(MAP_W-W,camX));
}

// ════════════════════
// UPDATE PROFESSORES
// ════════════════════
function updateTeachers(){
  const per=SCH[getPeriod()];
  teachers.forEach(t=>{
    if(t.scold>0)t.scold--;
    if(t.stun>0){t.stun--;return;}
    let lo=t.x1,hi=t.x2;
    if(t.room&&!per.free&&per.room===t.room){const r0=ROOMS[t.room];lo=r0.x+20;hi=r0.x+210;}
    t.x+=t.vx;
    if(t.x<lo){t.vx=Math.abs(t.vx);t.dir=1;}
    if(t.x>hi){t.vx=-Math.abs(t.vx);t.dir=-1;}
    if(penCD===0){
      for(const n of npcs){
        if(n.stun>0&&n.hitBy&&!n.reported&&n.fl===t.fl){
          const dx=(n.x+12)-(t.x+14);
          if(Math.sign(dx)===t.dir&&Math.abs(dx)<260){n.reported=true;addLines(100,t.name+' viu '+n.name+' caído no chão!');break;}
        }
      }
    }
    t.aT+=.11;t.fr=Math.floor(t.aT)%4;
    if(penCD===0 && canSee(t,P.x)){
      if(!per.free&&per.room!=='yard'){
        const rm=ROOMS[per.room];
        const inClass=rm&&P.fl===rm.fl&&P.x>rm.x&&P.x<rm.x+rm.w;
        if(!inClass&&t.fl===P.fl) addLines(50,t.name+': "Para a aula imediatamente!"');
      }
      if(Math.abs(P.vx)>2.3) addLines(30,t.name+': "Não se corre nos corredores!"');
    }
  });
}

// ════════════════════
// UPDATE NPCs
// ════════════════════
function updateNPCs(){
  const per=SCH[getPeriod()];
  const rm=per&&!per.free?ROOMS[per.room]:null;
  npcs.forEach((n,i)=>{
    if(n.stun>0){n.stun--;n.mov=false;return;}
    n.mov=true;
    const tgtFl=per.free?2:rm?rm.fl:n.fl;
    const tgtX=per.free?(per.room==='eat'?640+i*34:100+i*130):rm&&rm.desks[i%Math.max(1,rm.desks.length)]||500+i*80;
    if(n.fl!==tgtFl){
      n.sit=false;
      const st=STAIRS.find(s=>(s.lo===n.fl&&s.hi===tgtFl)||(s.hi===n.fl&&s.lo===tgtFl));
      if(st){
        if(Math.abs(n.x+12-st.x)<28){n.fl=n.fl===st.lo?st.hi:st.lo;n.x=st.x-8;}
        else{n.vx=n.x<st.x?.85:-.85;n.dir=n.vx>0?1:-1;}
      }
    } else if(!per.free&&rm&&rm.desks.length>0&&Math.abs(n.x-tgtX)<14){
      n.sit=true;n.vx=0;n.mov=false;n.x=tgtX;
    } else {
      n.sit=false;n.vx=n.x<tgtX?.85:-.85;n.dir=n.vx>0?1:-1;
    }
    if(n.mov){n.x+=n.vx;n.x=Math.max(4,Math.min(WALL-26,n.x));n.aT+=.15;n.fr=Math.floor(n.aT)%4;}
  });
}

// ════════════════════
// UPDATE PROJÉCTEIS
// ════════════════════
function updatePellets(){
  for(let i=pellets.length-1;i>=0;i--){
    const p=pellets[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--;
    if(p.life<=0||p.x<0||p.x>WALL){pellets.splice(i,1);continue;}
    let hit=false;
    for(const t of teachers){
      if(t.stun>0||t.fl!==p.fl) continue;
      if(p.x>t.x&&p.x<t.x+t.w&&p.y>GY[t.fl]-t.h&&p.y<GY[t.fl]){
        t.stun=240;boom(p.x-camX,p.y);pellets.splice(i,1);hit=true;break;
      }
    }
    if(hit) continue;
    for(const n of npcs){
      if(n.stun>0||n.fl!==p.fl) continue;
      if(p.x>n.x&&p.x<n.x+n.w&&p.y>GY[n.fl]-n.h&&p.y<GY[n.fl]){
        n.stun=300;n.hitBy='P';n.reported=false;boom(p.x-camX,p.y);pellets.splice(i,1);hit=true;break;
      }
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
}

// ════════════════════
// RENDER PROJÉCTEIS
// ════════════════════
function drawPellets(){
  pellets.forEach(p=>{
    const sx=p.x-camX;
    // Trilha
    ctx.fillStyle='rgba(150,150,150,.3)';
    ctx.beginPath();ctx.arc(sx-p.vx*2,p.y-p.vy*2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(100,100,100,.5)';
    ctx.beginPath();ctx.arc(sx-p.vx,p.y-p.vy,3.5,0,Math.PI*2);ctx.fill();
    // Projétil
    ctx.fillStyle='#888';ctx.beginPath();ctx.arc(sx,p.y,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(sx,p.y,2,0,Math.PI*2);ctx.fill();
  });
  parts.forEach(p=>{
    ctx.globalAlpha=p.life/32;
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

let blinkT=0;
let pCD=0;
function drawIndicator(){
  blinkT++;

  const rm=ROOMS[per.room];if(!rm) return;
  const onBlink=blinkT%50<32;

  const bounce=Math.sin(blinkT/8)*2;
  ctx.fillStyle='rgba(240,180,30,.95)';ctx.font='bold 14px Courier New';ctx.textAlign='center';

      const sx2=st.x-camX;
      ctx.fillText((needUp?'⬆':'⬇')+' ESCADAS',sx2+28,GY[P.fl]-85+bounce);
      const dx=st.x-P.x;
      ctx.fillText(dx>0?'→':'←',P.x-camX+14+(dx>0?44:-44),GY[P.fl]-85+bounce);

    const midX=rm.x+rm.w/2-camX;
    const dx=midX-(P.x-camX+14);
    ctx.fillText((dx>0?'→':'←')+' '+per.label.slice(3),P.x-camX+14+(dx>0?58:-58),GY[P.fl]-85+bounce);
  }
  ctx.textAlign='left';
}

// ════════════════════════════════════
// BATER NOS COLEGAS (tecla C)
// ════════════════════════════════════
const prevK={};
function pressed(k){return !!K[k]&&!prevK[k];}
function updateFight(){
  if(pCD>0)pCD--;
  if(P.sit||pCD>0||!pressed('c')&&!pressed('C')) return;
  pCD=26;
  const cx=P.x+14+P.dir*26;
  let hitAny=false;
  for(const n of npcs){
    if(n.fl!==P.fl||n.stun>0) continue;
    if(Math.abs(n.x+12-cx)<28){
      n.stun=420;n.hitBy='P';n.reported=false;n.x+=P.dir*14;boom(n.x-camX+12,GY[n.fl]-30);hitAny=true;break;
    }
  }
  if(hitAny){

}

let xp=0;
const quiz={st:'idle',t:0,next:420,q:null,opts:[],ans:0,npcT:Infinity,hand:false,msgT:0,teacher:''};
function addXP(n){xp+=n;document.getElementById('xpn').textContent=xp;document.getElementById('lvl').textContent=1+Math.floor(xp/50);}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function qShow(html,pct){
  const b=document.getElementById('qmsg');b.style.display='block';
  b.innerHTML=html+(pct!=null?'<div class="qb"><i style="width:'+Math.max(0,pct*100)+'%"></i></div>':'');
}
function qEnd(msg,nextDelay){
  quiz.st='idle';quiz.hand=false;quiz.next=nextDelay||(60*(9+Math.random()*6));
  if(msg){qShow(msg);quiz.msgT=150;} else document.getElementById('qmsg').style.display='none';
}
function updateQuiz(){
  const box=document.getElementById('qmsg');
  const per=SCH[getPeriod()];
  const rm=!per.free?ROOMS[per.room]:null;
  const teacher=rm?teachers.find(t=>t.room===per.room):null;
  const inRoom=rm&&P.fl===rm.fl&&P.x>rm.x&&P.x<rm.x+rm.w;
  const hPress=pressed('h')||pressed('H');
  const k1=pressed('1'),k2=pressed('2'),k3=pressed('3');
  Object.keys(prevK).forEach(k=>prevK[k]=false);Object.keys(K).forEach(k=>prevK[k]=K[k]);
  if(!rm||!teacher||!inRoom||teacher.stun>0){
    if(quiz.st!=='idle'){quiz.st='idle';quiz.hand=false;box.style.display='none';}
    else if(quiz.msgT>0){quiz.msgT--;if(!quiz.msgT)box.style.display='none';}
    return;
  }
  if(quiz.st==='idle'){
    if(quiz.msgT>0){quiz.msgT--;if(!quiz.msgT)box.style.display='none';}
    quiz.next--;
    if(quiz.next<=0){
      const bank=QB[per.room];const q=bank[Math.floor(Math.random()*bank.length)];
      quiz.q=q;quiz.opts=shuf([0,1,2]);quiz.ans=quiz.opts.indexOf(0);
      quiz.st='asked';quiz.t=60*8;quiz.total=quiz.t;quiz.teacher=teacher.name;
      const rn=npcs.filter(n=>n.sit);quiz.npcName=rn.length?rn[Math.floor(Math.random()*rn.length)].name:'Um colega';
      quiz.npcT=Math.random()<.4?60*(2.5+Math.random()*3.5):Infinity;
    }
    return;
  }
  if(quiz.st==='asked'){
    quiz.t--;quiz.npcT--;
    qShow('🧑‍🏫 <b>'+quiz.teacher+':</b> '+quiz.q[0]+'<br><span style="color:#f0b429">Prime H para levantar a mão!</span>',quiz.t/quiz.total);
    if(hPress){quiz.st='answer';quiz.hand=true;quiz.t=60*9;quiz.total=quiz.t;return;}
    if(quiz.npcT<=0){qEnd('🙋 '+quiz.npcName+' respondeu primeiro: <b>'+quiz.q[1]+'</b>');return;}
    if(quiz.t<=0){qEnd('⏰ Ninguém respondeu. Era: <b>'+quiz.q[1]+'</b>');}
    return;
  }
  if(quiz.st==='answer'){
    quiz.t--;
    const ops=quiz.opts.map((o,i)=>'<span class="op">'+(i+1)+') '+quiz.q[o+1]+'</span>').join('');
    qShow('✋ <b>'+quiz.teacher+'</b> chamou-te! '+quiz.q[0]+'<br>'+ops,quiz.t/quiz.total);
    const pick=k1?0:k2?1:k3?2:-1;
    if(pick>=0){
      if(pick===quiz.ans){addXP(10);qEnd('✅ Certo! <b>+10 XP</b>');}
      else qEnd('❌ Errado! Era: <b>'+quiz.q[1]+'</b>');
      return;
    }
    if(quiz.t<=0)qEnd('⏰ Demoraste demasiado. Era: <b>'+quiz.q[1]+'</b>');
  }
}

Object.keys(SHEET_B64).forEach(k=>{
  const im=new Image();im.onload=()=>{SPR.ready++;};im.src='data:image/png;base64,'+SHEET_B64[k];SPR.imgs[k]=im;
});
function sprReady(){return SPR.ready>=4;}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return[h,mx?d/mx:0,mx];}
function hsv2rgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return[(r+m)*255,(g+m)*255,(b+m)*255];}
function getSheet(kind,coatHex,skinHex){
  const key=kind+'|'+coatHex+'|'+(skinHex||'');
  if(SPR.cache[key]) return SPR.cache[key];
  const src=SPR.imgs[kind];
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const x=c.getContext('2d');x.drawImage(src,0,0);
  const id=x.getImageData(0,0,c.width,c.height),d=id.data;
  const th=rgb2hsv(...hex2rgb(coatHex))[0];
  const teacher=(kind==='prof'||kind==='profa');
  const base=hex2rgb('#f5c99a'),tg=skinHex?hex2rgb(skinHex):base;
  const fx=tg.map((v,i)=>v/base[i]);
  const headY=SPR.CH-2-66+16;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<10) continue;
    const r=d[i],g=d[i+1],b=d[i+2];
    const py=Math.floor(i/4/c.width)%SPR.CH;
    const [h,s,v]=rgb2hsv(r,g,b);
    let done=false;
    if(!teacher&&b>r+12&&b>g+6&&(r+g+b)<330){ // casaco azul
      const rr=hsv2rgb(th,Math.max(s,.4),v);d[i]=rr[0];d[i+1]=rr[1];d[i+2]=rr[2];done=true;
    } else if(teacher&&py>headY&&r>=g&&g>=b&&s>.25&&v<.55){ // casaco/calças castanhos
      const rr=hsv2rgb(th,Math.max(s,.45),v);d[i]=rr[0];d[i+1]=rr[1];d[i+2]=rr[2];done=true;
    }
    if(!done&&!teacher&&skinHex&&r>150&&r>g&&g>b&&(r-b)>40&&g>100){
      d[i]=Math.min(255,r*fx[0]);d[i+1]=Math.min(255,g*fx[1]);d[i+2]=Math.min(255,b*fx[2]);
    }
  }
  x.putImageData(id,0,0);
  SPR.cache[key]=c;return c;
}
function occupied(dx,fl){
  if(P.sit&&P.fl===fl&&Math.abs(P.x-dx)<6) return true;
  return npcs.some(n=>n.sit&&n.fl===fl&&Math.abs(n.x-dx)<6);
}
function sprDraw(sheet,f,cx,sy,flip){
  const W=SPR.CW,H=SPR.CH,sx0=(f%8)*W,sy0=Math.floor(f/8)*H;
  if(flip){ctx.save();ctx.translate(cx,0);ctx.scale(-1,1);ctx.drawImage(sheet,sx0,sy0,W,H,-W/2,sy-H+2,W,H);ctx.restore();}
  else ctx.drawImage(sheet,sx0,sy0,W,H,cx-W/2,sy-H+2,W,H);
}
function entFrame(ent,sit,stun){
  const isP=ent===P,t=Date.now();
  if(stun) return ent.stun<45?19+(Math.floor(ent.stun/12)%2):17+(Math.floor(t/350)%2);
  if(sit) return 10;
  if(isP){
    if(pCD>0) return pCD>17?13:pCD>9?14:15;
    if(sCD>22) return 16;
    if(quiz.hand) return 11+(Math.floor(t/300)%2);
  }
  if(ent.mov){const run=isP&&Math.abs(P.vx)>2.3;return(run?6:2)+(Math.floor(ent.aT)%4);}
  return Math.floor(t/600)%2;
}
const _drawStudentOld=drawStudent,_drawTeacherOld=drawTeacher;
drawStudent=function(sx,sy,dir,shirt,hair,fr,sit,stun,skinTone,ent){
  if(!sprReady()||!ent) return _drawStudentOld(sx,sy,dir,shirt,hair,fr,sit,stun,skinTone);
  const kind=ent.fem?'aluna':'eric';
  const sheet=getSheet(kind,ent===P?'#1f2a5a':shirt,ent===P?null:skinTone);
  const f=entFrame(ent,sit,stun);
  drawShadow(sx,sy+1,22);
  if(sit) sprDraw(sheet,f,sx+32,sy,true);
  else sprDraw(sheet,f,sx,sy,dir<0);
};
drawTeacher=function(sx,sy,dir,coat,fr,stun,name,skinTone,hairC,ent){
  if(!sprReady()||!ent) return _drawTeacherOld(sx,sy,dir,coat,fr,stun,name,skinTone,hairC);
  const kind=ent.fem?'profa':'prof';
  const sheet=getSheet(kind,coat,null);
  let f;
  if(stun) f=ent.stun<45?19+(Math.floor(ent.stun/12)%2):17+(Math.floor(Date.now()/350)%2);
  else if(ent.scold>0) f=11+(Math.floor(Date.now()/250)%2);
  else f=2+(Math.floor(ent.aT)%4);
  drawShadow(sx,sy+1,24);
  sprDraw(sheet,f,sx,sy,dir<0);
  ctx.font='bold 8px Courier New';ctx.textAlign='center';
  const tw=ctx.measureText(name).width+8;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(sx-tw/2,sy-92,tw,11);
  ctx.fillStyle='#fff';ctx.fillText(name,sx,sy-83);ctx.textAlign='left';
};

// ════════════════════
// LOOP
// ════════════════════
function loop(){
  if(gameOver){requestAnimationFrame(loop);return;}
  ctx.clearRect(0,0,W,H);
  updateSCH();updateP();updateFight();updateQuiz();updateTeachers();updateNPCs();updatePellets();
  drawBG();drawStairs();drawRooms();drawEntities();drawPellets();drawWall();drawIndicator();
  requestAnimationFrame(loop);
}
loop();
